name: Reusable - Sync beta back to dev after prerelease

on:
  workflow_call:
    inputs:
      beta_branch:
        type: string
        required: false
        default: "beta"
      dev_branch:
        type: string
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.beta_branch }}
          fetch-depth: 0

      - name: Force push beta to dev
        run: git push origin ${{ inputs.beta_branch }}:${{ inputs.dev_branch }} --force
